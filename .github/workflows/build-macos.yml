name: Build macOS
permissions:
  contents: read

# Reusable build of the macOS arm64 app, shared by CI and Release.
# Signed with the Developer ID certificate when its secrets are available (callers pass `secrets: inherit`);
# pull requests from forks get no secrets and fall back to an ad-hoc signature.
on:
  workflow_call:
    inputs:
      source_ref:
        description: Source ref to build; defaults to the calling workflow ref
        type: string
        default: ""
      notarize:
        description: Notarize and staple the app (needs the App Store Connect API key secrets)
        type: boolean
        default: false

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Build core
        working-directory: packages/core
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install desktop app dependencies
        working-directory: packages/desktop-app
        run: npm ci

      - name: Build desktop app
        working-directory: packages/desktop-app
        run: npx gushio gushio/target-build.js 'configuration production'

      - name: Check signing secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID secrets: the app gets an ad-hoc signature"
          fi
          if [ "${{ inputs.notarize }}" = "true" ] && [ -z "$CSC_LINK" ]; then
            echo "::error::Notarization needs the Developer ID secrets"
            exit 1
          fi

      # notarytool reads the App Store Connect API key from a file
      - name: Write the App Store Connect API key
        if: inputs.notarize
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # Not electron-builder's CSC_LINK import: app-builder-lib 26.15.3 passes the certificate password to
      # `security set-key-partition-list -k`, which expects the keychain password, so the import fails and the
      # failing command (password included) ends up in the log
      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Hardened runtime, Developer ID signature and, for releases, notarization with the ticket stapled to the app.
      # The zip and latest-mac.yml are what the in-app updater reads from GitHub Releases.
      - name: Package signed dmg and zip
        if: steps.signing.outputs.signed == 'true'
        working-directory: packages/desktop-app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >
          npx electron-builder build --mac dmg zip --arm64 --publish never
          -c.mac.notarize=${{ inputs.notarize }}

      # Apple Silicon refuses to launch unsigned bundles, so without the certificate the app gets an
      # ad-hoc signature before it is wrapped in the dmg
      - name: Package ad-hoc app bundle
        if: steps.signing.outputs.signed != 'true'
        working-directory: packages/desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder build --mac dir --arm64 --publish never \
            -c.mac.identity=null -c.mac.forceCodeSigning=false -c.mac.notarize=false -c.mac.hardenedRuntime=false
          codesign --force --deep --sign - release/mac-arm64/Freeleapp.app
          npx electron-builder build --mac dmg zip --arm64 --publish never \
            --prepackaged release/mac-arm64/Freeleapp.app \
            -c.mac.identity=null -c.mac.forceCodeSigning=false -c.mac.notarize=false -c.mac.hardenedRuntime=false

      - name: Remove the signing keychain and the App Store Connect API key
        if: always()
        run: |
          if [ -n "$CSC_KEYCHAIN" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

      # electron-builder compiles mac.icon (Icon Composer) into Assets.car for the macOS 26+ Liquid Glass icon
      - name: Check Liquid Glass icon
        working-directory: packages/desktop-app/release/mac-arm64/Freeleapp.app/Contents
        run: |
          test -f Resources/Assets.car
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" Info.plist

      - name: Check signature
        working-directory: packages/desktop-app/release/mac-arm64
        run: |
          codesign --verify --deep --strict --verbose=2 Freeleapp.app
          codesign --display --verbose=2 Freeleapp.app 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Runtime|Timestamp|Signature)"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            codesign --display --verbose=2 Freeleapp.app 2>&1 | grep -q "^Authority=Developer ID Application:"
          fi

      # Gatekeeper must accept the app as notarized, the way it does after a download or brew install
      - name: Check notarization
        if: inputs.notarize
        working-directory: packages/desktop-app/release/mac-arm64
        run: |
          xcrun stapler validate Freeleapp.app
          spctl --assess --type execute --verbose=4 Freeleapp.app 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt

      - name: List release files
        working-directory: packages/desktop-app/release
        run: |
          ls -la
          test -f latest-mac.yml && cat latest-mac.yml

      # The dmg alone, unzipped, for manual testing from the Actions page
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          archive: false
          path: packages/desktop-app/release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            packages/desktop-app/release/*.dmg
            packages/desktop-app/release/*.zip
            packages/desktop-app/release/*.blockmap
            packages/desktop-app/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
