name: Release
permissions:
  contents: read

# Push a tag like v1.2.3 on master to publish a GitHub Release with the macOS build.
# The tag must match packages/desktop-app/package.json and have a "## 1.2.3" entry in CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Test security boundaries
        run: npm run test:security

      - name: Build and test core
        working-directory: packages/core
        run: |
          npm ci --ignore-scripts
          npm run build
          npx jest --runInBand

      - name: Check tag, app version and changelog agree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./packages/desktop-app/package.json').version")
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $APP_VERSION"
            exit 1
          fi
          if ! grep -q "^## $VERSION " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' entry"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build-macos.yml
    with:
      notarize: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: dist

      - name: Write release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Install

          Download \`Freeleapp-$VERSION-arm64.dmg\` from this repository (Apple Silicon).
          This security fork does not use the upstream Homebrew tap or automatic updates.

          Security audit and limitations: https://github.com/kannanr/freeleapp/blob/master/docs/security/AUDIT.md
          EOF
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Freeleapp $VERSION" \
            --notes-file notes.md
