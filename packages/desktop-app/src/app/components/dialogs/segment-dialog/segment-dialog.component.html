<app-dialog-escape (escape)="closeModal()"></app-dialog-escape>
<a class="close-modal" (click)="closeModal()"><i class="moon-Close"></i></a>
<h4>Save Filter</h4>

<form [formGroup]="form" class="form center-vertical text-left">

  <ng-select #ngSelectComponent
             type="text"
             placeholder="Name This Filter, e.g. Production us-east-1"
             formControlName="segmentName"
             bindLabel="name"
             bindValue="name"
             [closeOnSelect]="true"
             (keyup)="setTemporaryName($event)"
             (keydown.enter)="setByEnter()"
             [items]="segments"
             [(ngModel)]="selectedSegment" dropdownPosition="bottom">
    <ng-template ng-footer-tmp>
      <div class="create-new" *ngIf="!checkNewSegment()"><i class="fal fa-plus-circle"></i>&nbsp;Add new filter</div>
      <div class="create-new add" (click)="addNewSegment()" *ngIf="checkNewSegment()"><i class="fal fa-plus-circle"></i>&nbsp;Add "<strong>{{temporaryName}}</strong>"</div>
    </ng-template>
  </ng-select>

  <small>The filter will show under Saved Filters in your sidebar.</small>
  <br>
  <br>
  <button (click)="saveSegment()" [disabled]="!formValid()" class="btn-control {{formValid() ? '': 'mat-button-disabled'}}">Save Filter</button>
  <a (click)="closeModal()">Cancel</a>

</form>
