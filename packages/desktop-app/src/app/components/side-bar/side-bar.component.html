<div class="sidebar-flex">
<mat-list>
  <mat-list-item (click)="resetFilters();" class="counted-item {{this.showAll ? 'selected-segment' : ''}}">
    <div matListItemTitle class="mat-line sidebar-row"><i class="moon-Row"></i> <span class="sidebar-row-label">Sessions</span>
      <span class="sidebar-count" *ngIf="activeSessions > 0" [matTooltip]="activeSessions + ' active ' + (activeSessions === 1 ? 'session' : 'sessions')">{{badge(activeSessions)}}</span></div>
  </mat-list-item>
  <mat-list-item (click)="showOnlyPinned();" class="{{this.showPinned ? 'selected-segment' : ''}}">
    <div matListItemTitle class="mat-line sidebar-row"><i class="moon-Pin"></i> <span class="sidebar-row-label">Pinned Sessions</span></div>
  </mat-list-item>
  <mat-list-item (click)="showTunnelsView(false);" class="counted-item {{this.showTunnels && !this.showPinnedTunnels ? 'selected-segment' : ''}}">
    <div matListItemTitle class="mat-line sidebar-row"><i class="moon-Server"></i> <span class="sidebar-row-label">Tunnels</span>
      <span class="sidebar-count" *ngIf="runningTunnels > 0" [matTooltip]="runningTunnels + ' running ' + (runningTunnels === 1 ? 'tunnel' : 'tunnels')">{{badge(runningTunnels)}}</span></div>
  </mat-list-item>
  <mat-list-item (click)="showTunnelsView(true);" class="{{this.showPinnedTunnels ? 'selected-segment' : ''}}">
    <div matListItemTitle class="mat-line sidebar-row"><i class="moon-Pin"></i> <span class="sidebar-row-label">Pinned Tunnels</span></div>
  </mat-list-item>
  <div class="space-between-mat-lists"></div>
  <app-integration-bar></app-integration-bar>
  <div class="space-between-mat-lists"></div>
  <mat-accordion>
    <mat-expansion-panel [expanded]="true">
      <mat-expansion-panel-header>
        <mat-panel-title>
          <div matSubheader><span>Saved Filters</span><i class="moon-Caret-down"></i></div>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <mat-list-item [disableRipple]="true" *ngFor="let segment of segments" [ngClass]="selectedSegmentCheck(segment)"
                     (click)="applySegmentFilter(segment, $event);">
        <div matListItemTitle class="mat-line sidebar-row visible-option-menu segment-row"><i class="moon-Tag"></i> <span class="sidebar-row-label">{{segment.name}}</span><i class="moon-Close"
                                                                                                                       (click)="showConfirmationDialog(segment, $event)"></i>
        </div>
      </mat-list-item>

    </mat-expansion-panel>
  </mat-accordion>
</mat-list>
<button *ngIf="updaterService.downloadedVersion" class="btn-control btn-sm update-button" (click)="updaterService.installUpdate();"
        [matTooltip]="'Restart and update to Freeleapp ' + updaterService.downloadedVersion"><i class="moon-Refresh"></i><span>Update</span></button>
</div>
